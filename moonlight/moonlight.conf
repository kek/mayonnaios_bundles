## Moonlight Embedded on the Anbernic RG40XXV.
##
## This file ships inside the bundle at share/moonlight/moonlight.conf and is
## replaced wholesale on upgrade, so nothing device- or player-specific
## belongs here: no host address, no app name. The launcher passes this file
## with -config and supplies the host on the command line; anything a player
## changes should go the same way, not into this file.
##
## What does belong here is what the hardware dictates.

## The stream is decoded in software on four Cortex-A53s -- the Cedrus VPU
## needs the V4L2 request API, which nothing in this build speaks yet -- and
## the panel is 640x480. So 720p is the ceiling worth attempting and 30 fps
## is the honest starting point; the GPU scales the decoded frame down to the
## panel, which costs nothing next to the decode itself. If 720p30 stutters
## on hardware, 640x480 at the same fps is the next thing to try, and a
## Sunshine host will serve that resolution directly.
width = 1280
height = 720
fps = 30

## Modest on purpose: bitrate buys visual quality but costs decode time, and
## the decoder is the bottleneck here, not the radio.
bitrate = 5000

## H.264 rather than auto: HEVC halves the bitrate for the same quality but
## costs roughly twice the CPU to decode, and CPU is the scarce thing.
codec = h264

## The only platform this build contains -- SDL on KMSDRM. Saying it
## explicitly skips the auto-detection walk.
platform = sdl

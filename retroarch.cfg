# Bundle-relative paths for RetroArch on the RG40XXV.
#
# Layered with --appendconfig rather than used as the main config, on purpose.
# RetroArch saves settings back into its main config, and this file lives
# inside the bundle -- which is replaced wholesale on upgrade. Appending keeps
# the player's own settings in /root/.config/retroarch/retroarch.cfg, where
# they survive, while these directory paths follow whichever bundle is
# installed.
#
# The paths must be absolute and must point through `current`, the symlink the
# installer moves. Nothing here mentions a version, so an upgrade changes
# nothing in this file.
#
# The build sets --prefix=/ so RetroArch's compiled-in defaults point at
# /usr/share/retroarch, which does not exist on this device: the rootfs is a
# read-only squashfs and the bundle lives on the writable partition. Every
# directory therefore has to be redirected here.

joypad_autoconfig_dir = "/root/bundles/retroarch/current/share/retroarch/autoconfig"
libretro_directory = "/root/bundles/retroarch/current/lib/libretro"
libretro_info_path = "/root/bundles/retroarch/current/share/retroarch/info"
assets_directory = "/root/bundles/retroarch/current/share/retroarch/assets"

# Writable, and on the partition with 13 GB free rather than the full rootfs.
savefile_directory = "/root/retroarch/saves"
savestate_directory = "/root/retroarch/states"
system_directory = "/root/retroarch/system"
screenshot_directory = "/root/retroarch/screenshots"

# The drivers this device actually has. Set explicitly so a probe cannot pick
# something else and fail later: video is KMS/DRM with GLES on the Mali-G31,
# input is udev because there is no other way to read the gamepad here, and
# audio is ALSA.
video_driver = "gl"
input_driver = "udev"
input_joypad_driver = "udev"
audio_driver = "alsa"

# RGUI is the only menu built into this bundle. The others -- XMB, Ozone,
# MaterialUI -- were disabled at build time because they want assets this
# bundle does not ship, and selecting one would give a blank screen.
menu_driver = "rgui"

# 640x480, matching the panel exactly. RetroArch picked this itself from the
# DRM mode list, but pinning it means a future kernel offering another mode
# cannot quietly change what the player sees.
video_fullscreen = "true"
video_fullscreen_x = "640"
video_fullscreen_y = "480"

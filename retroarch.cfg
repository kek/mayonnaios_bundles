# Bundle-relative paths for RetroArch on the RG40XXV.
#
# Layered with --appendconfig rather than used as the main config, on purpose.
# RetroArch saves settings back into its main config, and this file lives
# inside the bundle -- which is replaced wholesale on upgrade. Appending keeps
# the player's own settings in /root/.config/retroarch/retroarch.cfg, where
# they survive, while these directory paths follow whichever bundle is
# installed.
#
# The paths must be absolute and must point through `current`, the symlink the
# installer moves. Nothing here mentions a version, so an upgrade changes
# nothing in this file.
#
# The build sets --prefix=/ so RetroArch's compiled-in defaults point at
# /usr/share/retroarch, which does not exist on this device: the rootfs is a
# read-only squashfs and the bundle lives on the writable partition. Every
# directory therefore has to be redirected here.

joypad_autoconfig_dir = "/root/bundles/retroarch/current/share/retroarch/autoconfig"
libretro_info_path = "/root/bundles/retroarch/current/share/retroarch/info"
assets_directory = "/root/bundles/retroarch/current/share/retroarch/assets"

# libretro_directory is deliberately NOT set here, so RetroArch uses its own
# default: ~/.config/retroarch/cores.
#
# The cores themselves are not there. MayonnaiOS.Cores fills that directory
# with symlinks at boot, pointing at the real .so files -- the ones this bundle
# ships, under lib/libretro, and any separately installed core bundles under
# /root/cores. So an upgrade cannot lose a core, installing one never writes
# into a bundle, and RetroArch is looking exactly where it would look with no
# configuration at all.
#
# Setting it was the previous arrangement, and every layer it had to pass
# through was a chance to be wrong. RetroArch validates directory settings and
# silently discards ones that do not exist. It persists the ones that do into
# its main config on exit, so the value outlives the bundle that set it. And
# the bundle carrying the setting is replaced wholesale on upgrade -- which is
# how this device spent a week reading cores out of a stale v1.22.2-4 whose
# copy of this file predated a change. A setting that is not set cannot do any
# of that.

# Saves, states, BIOS and screenshots are deliberately NOT set here.
#
# They used to be, pointing at /root/retroarch/{saves,states,system,
# screenshots} -- and RetroArch discarded all four on every launch, because it
# validates directory settings and silently drops the ones that do not exist.
# Nothing created them. With --verbose it says so plainly:
#
#     [WARN] [Config] "savefile_directory" is not a directory, ignoring...
#     [WARN] [Config] "savestate_directory" is not a directory, ignoring...
#
# So the effective location was always RetroArch's own default,
# ~/.config/retroarch/{saves,states,...}, which is on the writable partition
# and works. Setting values that get thrown away only made the shipped config
# describe a layout the device does not use, and cost an afternoon of reading
# it as though it did.
#
# Creating the four directories would make these settings take effect, but the
# location is a decision rather than a detail: saves are the thing a player
# would want to carry between SD cards, so where they live belongs in
# MayonnaiOS configuration alongside the ROM roots, not hardcoded in a bundle
# that gets replaced on upgrade. Until that exists, RetroArch's default is
# both correct and honest.

# The drivers this device actually has. Set explicitly so a probe cannot pick
# something else and fail later: video is KMS/DRM with GLES on the Mali-G31,
# input is udev because there is no other way to read the gamepad here, and
# audio is ALSA.
video_driver = "gl"
input_driver = "udev"
input_joypad_driver = "udev"
audio_driver = "alsa"

# RGUI is the only menu built into this bundle. The others -- XMB, Ozone,
# MaterialUI -- were disabled at build time because they want assets this
# bundle does not ship, and selecting one would give a blank screen.
menu_driver = "rgui"

# A confirms, B goes back.
#
# RetroArch defaults the other way round. menu_driver.c:5294 reads
#
#     menu_ok_btn     = swap_ok_cancel_btns ? JOYPAD_B : JOYPAD_A;
#     menu_cancel_btn = swap_ok_cancel_btns ? JOYPAD_A : JOYPAD_B;
#
# and config.def.h:968 defaults that flag to true, so OK is RetroPad B -- the
# bottom face button. On this shell, which is laid out the Nintendo way with A
# on the right, that means the bottom button confirms and the right one backs
# out. It reads as "A and B are swapped" even though the pad is mapped
# correctly by position: it is the menu's convention, not the mapping.
#
# Setting it false puts OK on A, which is what the A button on a Nintendo
# layout has always done, and matches the launcher this device boots into
# where A starts the highlighted entry.
menu_swap_ok_cancel_buttons = "false"

# 640x480, matching the panel exactly. RetroArch picked this itself from the
# DRM mode list, but pinning it means a future kernel offering another mode
# cannot quietly change what the player sees.
video_fullscreen = "true"
video_fullscreen_x = "640"
video_fullscreen_y = "480"

# RetroArch joypad autoconfig for the Anbernic RG40XXV.
#
# Without this, RetroArch finds the pad and refuses to use it:
#
#     [udev] Pad #0 (/dev/input/event0) supports 0 force feedback effects.
#     [Autoconf] gpio-keys-gamepad (1/1) not configured.
#
# input_device must match the device name exactly as udev reports it, which is
# the device tree node name -- "gpio-keys-gamepad", printed in that line.
#
# ## Where these numbers come from
#
# They are indices, not evdev codes. input/drivers_joypad/udev_joypad.c:235-249
# assigns them by walking the device's key bits in a fixed order: KEY_UP..
# KEY_DOWN first, then BTN_MISC (0x100) upward, then the two remaining ranges.
# This pad has nothing below 0x100, so every button falls in the second pass
# and the indices are simply its codes in ascending order:
#
#     304 BTN_SOUTH   0        313 BTN_TR2      7
#     305 BTN_EAST    1        314 BTN_SELECT   8
#     307 BTN_NORTH   2        315 BTN_START    9
#     308 BTN_WEST    3        316 BTN_MODE    10
#     310 BTN_TL      4        317 BTN_THUMBL  11
#     311 BTN_TR      5        544 DPAD_UP     12
#     312 BTN_TL2     6        545 DPAD_DOWN   13
#                              546 DPAD_LEFT   14
#                              547 DPAD_RIGHT  15
#
# Which means the indices move whenever the device tree grows a key on this
# node, and they have moved once already. Firmware 4fcc0ec added the stick
# click as BTN_THUMBL (317), which sorts between BTN_MODE (316) and the D-pad
# block (544..547) -- so the face buttons kept their indices and only the
# D-pad shifted up by one. The symptom of a stale table here is exactly that
# shape: every button fine, the D-pad rotated one position -- up acting as
# down, down acting as left, which in RGUI reads as "down jumps to the top".
#
# ## The part that is not mechanical
#
# This board's device tree disagrees with its own shell about X and Y, which
# was established by pressing them rather than by reading the DTS: the button
# silkscreened X emits 308 (BTN_WEST) and the one silkscreened Y emits 307
# (BTN_NORTH). A and B are the usual Nintendo-vs-Linux swap -- A is east (305)
# and B is south (304).
#
# RetroPad is laid out SNES-style: B bottom, A right, Y left, X top. Mapping
# by physical position, which is what a player's thumb knows:
#
#     shell B  bottom  304  index 0  -> input_b_btn
#     shell A  right   305  index 1  -> input_a_btn
#     shell Y  left    307  index 2  -> input_y_btn
#     shell X  top     308  index 3  -> input_x_btn
#
# Reading the device tree instead would have swapped X and Y, and the failure
# would have been silent -- two buttons that work and do the wrong thing.

input_driver = "udev"
input_device = "gpio-keys-gamepad"

input_b_btn = "0"
input_a_btn = "1"
input_y_btn = "2"
input_x_btn = "3"

input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"

input_select_btn = "8"
input_start_btn = "9"

# Menu is the only button not mapped to a RetroPad face: it opens RetroArch's
# own menu, which is the one thing a player needs that a game cannot provide.
input_menu_toggle_btn = "10"

# The stick click. RetroPad calls it L3, and so does the silkscreen's sibling
# documentation (muOS's vendor tree labels the pin "Key L3").
input_l3_btn = "11"

input_up_btn = "12"
input_down_btn = "13"
input_left_btn = "14"
input_right_btn = "15"

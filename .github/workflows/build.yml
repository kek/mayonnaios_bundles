name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      retroarch_version:
        description: RetroArch version to build
        default: "1.22.2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RETROARCH_VERSION: "1.22.2"
  # The system whose sysroot this links against. RetroArch must be built with
  # the exact libgbm, libEGL, libGLESv2, libdrm, libasound and libudev the
  # device runs, or the sonames disagree and it fails at runtime -- on the
  # device, which is the slowest place to find out.
  SYSTEM_REPO: kek/nerves_system_rg40xxv
  SYSTEM_TAG: v0.2.0
  SYSTEM_ARTIFACT: nerves_system_rg40xxv-portable-0.1.0-A58E483.tar.gz
  # Must be the Linux build of the Nerves toolchain, not a distribution's
  # cross-gcc: same compiler and same libc the system was built with.
  TOOLCHAIN_VERSION: "15.3.0"
  TOOLCHAIN_ASSET: nerves_toolchain_aarch64_nerves_linux_gnu-linux_x86_64-15.3.0-8DAF9F3.tar.xz

# Read by default; the build job asks for write because it publishes.
#
# This repository's default workflow permission is "read", which is why every
# tag build failed on its last step:
#
#     Found release RetroArch 1.22.2 (bundle 4, OK on A) (with id=371447587)
#     HttpError: Resource not accessible by integration
#
# action-gh-release found the release and was refused permission to attach the
# tarballs. The same commit passed on trunk only because that step is gated on
# refs/tags/v and never ran there -- so the build was never the problem, and
# the tag/branch split was the whole tell.
#
# Declared here rather than by flipping the repository setting, so it is
# visible in the tree and survives the repo being recreated.
permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl pkg-config xz-utils

      - name: Cache the toolchain and sysroot
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/toolchain
            ~/sysroot
          key: ${{ env.TOOLCHAIN_ASSET }}-${{ env.SYSTEM_ARTIFACT }}

      - name: Fetch the Nerves toolchain
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchain
          curl -fsSL -o /tmp/toolchain.tar.xz \
            "https://github.com/nerves-project/toolchains/releases/download/v${TOOLCHAIN_VERSION}/${TOOLCHAIN_ASSET}"
          tar -xJf /tmp/toolchain.tar.xz -C ~/toolchain --strip-components=1

      - name: Fetch the system sysroot
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          # The artifact is ~550 MB and only staging/ is needed, but the
          # tarball is not seekable, so it comes down whole and is thrown away.
          mkdir -p ~/sysroot /tmp/system
          curl -fsSL -o /tmp/system.tar.gz \
            "https://github.com/${SYSTEM_REPO}/releases/download/${SYSTEM_TAG}/${SYSTEM_ARTIFACT}"
          tar -xzf /tmp/system.tar.gz -C /tmp/system
          mv /tmp/system/*/staging/* ~/sysroot/
          rm -rf /tmp/system /tmp/system.tar.gz

      - name: Check the sysroot has what RetroArch links
        # Fail here rather than 40 minutes later at the link, and name the
        # missing library instead of leaving a configure probe to say
        # something misleading about a host path.
        run: |
          rc=0
          for pc in gbm egl glesv2 libdrm alsa libudev freetype2; do
            if [ -f ~/sysroot/usr/lib/pkgconfig/$pc.pc ] || \
               [ -f ~/sysroot/usr/share/pkgconfig/$pc.pc ]; then
              echo "ok       $pc"
            else
              echo "MISSING  $pc"
              rc=1
            fi
          done
          exit $rc

      - name: Build the bundle
        env:
          RETROARCH_VERSION: ${{ inputs.retroarch_version || '1.22.2' }}
        run: |
          SYSROOT="$HOME/sysroot" \
          CROSS="$HOME/toolchain/bin/aarch64-nerves-linux-gnu-" \
            ./build.sh

      - name: Check the bundle is what it claims to be
        # A tarball that unpacks is not evidence. These are the three things
        # that have actually gone wrong: a binary built for the wrong
        # architecture, a missing udev link that leaves the gamepad dead, and a
        # missing autoconfig that leaves it unmapped.
        run: |
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          tar -xzf out/retroarch-*-aarch64.tar.gz -C /tmp/verify

          file /tmp/verify/bin/retroarch | tee /tmp/file.txt
          grep -q "ARM aarch64" /tmp/file.txt

          readelf -d /tmp/verify/bin/retroarch | grep NEEDED
          readelf -d /tmp/verify/bin/retroarch | grep -q "libudev"
          readelf -d /tmp/verify/bin/retroarch | grep -q "libGLESv2"

          test -f /tmp/verify/share/retroarch/autoconfig/gpio-keys-gamepad.cfg
          test -f /tmp/verify/share/retroarch/retroarch.cfg
          ls /tmp/verify/lib/libretro/*.so

          # Cores must not be read from inside the bundle. If libretro_directory
          # ever points back at a bundle path, every separately installed core
          # is silently lost at the next RetroArch upgrade -- which is a bug
          # that only shows up one release later, on the device, as a core that
          # used to be there.
          grep -q '^libretro_directory = "/root/retroarch/cores"' \
            /tmp/verify/share/retroarch/retroarch.cfg

      - name: Check each core also ships on its own
        # The per-core tarballs are what ScenicRg40xxv.Cores installs when
        # someone picks a core from the upload page. Flat -- just the .so at
        # the root -- because the installer symlinks whatever .so it finds.
        run: |
          rc=0
          while read -r name repo; do
            case "$name" in ''|\#*) continue ;; esac
            tarball="out/${name}-"*"-aarch64.tar.gz"
            if ! ls $tarball >/dev/null 2>&1; then
              echo "MISSING  $name tarball"; rc=1; continue
            fi
            rm -rf /tmp/core && mkdir -p /tmp/core
            tar -xzf $tarball -C /tmp/core
            if [ -f "/tmp/core/${name}_libretro.so" ]; then
              file "/tmp/core/${name}_libretro.so" | grep -q "ARM aarch64" \
                && echo "ok       $name" || { echo "WRONG ARCH  $name"; rc=1; }
            else
              echo "MISSING  ${name}_libretro.so at the archive root"; rc=1
            fi
          done < cores.txt
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: retroarch-bundle
          path: |
            out/*.tar.gz
            out/*.tar.gz.sha256
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.tar.gz
            out/*.tar.gz.sha256
